[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gatekeeper-guard"
version = "0.1.0"
description = "Check what your AI agent reads before it acts: a prompt-injection firewall with a built-in Learn Mode."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests", "beautifulsoup4", "flask"]

[project.scripts]
gatekeeper = "gatekeeper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gatekeeper = ["learn/index.html"]
